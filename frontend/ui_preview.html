<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZimID UI Preview</title>
    <style>
      body { margin:0; font-family: Inter, Arial, sans-serif; background:#f3f6ff; }
      .wrap { max-width:420px; margin:24px auto; padding:16px; }
      .card { border-radius:16px; padding:18px; color:white; min-height:170px; background:linear-gradient(120deg,#17358E,#2D6BFF); box-shadow:0 12px 24px rgba(0,0,0,.16); }
      .tray { display:flex; gap:10px; overflow:auto; margin:16px 0; }
      .pill { background:white; border-radius:12px; padding:12px 14px; font-weight:600; white-space:nowrap; }
      .module { background:white; border-radius:12px; padding:14px; margin:10px 0; box-shadow:0 8px 16px rgba(0,0,0,.08); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h2>ZimID Wallet</h2>
      <div class="card">
        <small>Republic of Zimbabwe</small>
        <h3 style="margin-bottom:0">TINASHE MOYO</h3>
        <small>ID: 63-123456-A-12</small>
      </div>
      <div class="tray">
        <div class="pill">Digital ID</div>
        <div class="pill">Passport</div>
        <div class="pill">Driver's License</div>
      </div>
      <div class="module">Passport Application</div>
      <div class="module">Birth Certificate</div>
      <div class="module">Driver's License</div>
    </div>
  </body>
</html>
